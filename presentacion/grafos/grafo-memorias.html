<!doctype html>
<html lang="es" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DesviAI · Grafo de memorias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --font: 'Manrope', 'Segoe UI', system-ui, sans-serif; --mono: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace; }
  :root[data-theme="dark"] {
    --bg0: #101a36; --bg1: #050813; --ink: #eef2fa; --ink2: #c6cedf; --muted: #8b96ad;
    --faint: rgba(148, 163, 184, .16); --card: rgba(16, 24, 46, .86); --solid: #121b33;
    --cardline: rgba(148, 163, 184, .24); --tipbg: rgba(13, 20, 40, .94); --barbg: rgba(13, 20, 40, .78);
    --epi: #60a5fa; --sem: #a78bfa; --proc: #34d399; --acc: #fb923c; --risk: #f87171; --warn: #fbbf24;
    --lane: .075; --laneline: .30; --neb: .26; --star: #cfd8ff;
  }
  :root[data-theme="light"] {
    --bg0: #ffffff; --bg1: #eef0f4; --ink: #111827; --ink2: #374151; --muted: #6b7280;
    --faint: rgba(17, 24, 39, .08); --card: #ffffff; --solid: #ffffff;
    --cardline: #e1e4ea; --tipbg: rgba(255, 255, 255, .97); --barbg: rgba(255, 255, 255, .88);
    --epi: #1F65E5; --sem: #6D52E0; --proc: #16A34A; --acc: #F36C24; --risk: #DC2626; --warn: #D97706;
    --lane: .05; --laneline: .30; --neb: .07; --star: #000;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg1); font-family: var(--font); }
  #stage { width: 100vw; height: 100vh; display: block; user-select: none; }

  [data-theme="dark"] .glow { filter: url(#glow); }
  [data-theme="dark"] .sglow { filter: url(#softglow); }
  [data-theme="light"] .card { filter: url(#shadow); }
  .stars { display: none; } [data-theme="dark"] .stars { display: inline; }
  .twinkle { animation: tw 3.4s ease-in-out infinite alternate; }
  @keyframes tw { from { opacity: .12; } to { opacity: .95; } }
  .flow { stroke-dasharray: 8 10; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -36; } }
  .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { 0%, 100% { opacity: .35; transform: scale(1); } 50% { opacity: .9; transform: scale(1.12); } }

  [data-id] { cursor: pointer; }
  [data-id], .edge, .particle, .elabel { transition: opacity .25s ease; }
  .focus [data-id]:not(.on), .focus .edge:not(.on), .focus .particle:not(.on), .focus .elabel:not(.on) { opacity: .07; }
  .elabel.opt { opacity: 0; }
  .focus .elabel.opt.on { opacity: 1; }
  .halo { paint-order: stroke; stroke: var(--bg1); stroke-width: 6px; stroke-linejoin: round; }
  .inactive { opacity: .16; }
  .step { transition: opacity .5s ease; }
  .playing .pending { opacity: 0 !important; }

  #tip { position: fixed; pointer-events: none; max-width: 380px; padding: 12px 14px; border-radius: 12px;
    background: var(--tipbg); color: var(--ink); border: 1px solid var(--cardline); font: 13px/1.5 var(--font);
    box-shadow: 0 14px 36px rgba(0, 0, 0, .28); opacity: 0; transform: translateY(4px);
    transition: opacity .15s, transform .15s; z-index: 10; backdrop-filter: blur(8px); }
  #tip.show { opacity: 1; transform: none; }
  #tip .k { color: var(--muted); font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  #tip .t { font-size: 15px; font-weight: 800; margin: 2px 0 6px; }
  #tip .src { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-top: 8px; }
  #tip ul { margin: 4px 0 0; padding-left: 18px; }

  #bar { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 4px; align-items: center;
    padding: 6px; border-radius: 999px; background: var(--barbg); border: 1px solid var(--cardline);
    box-shadow: 0 12px 32px rgba(0, 0, 0, .28); backdrop-filter: blur(12px); transition: opacity .4s, transform .4s; z-index: 5; }
  #bar.idle { opacity: 0; transform: translate(-50%, 12px); pointer-events: none; }
  #bar button { font: 700 13px var(--font); color: var(--ink2); background: transparent; border: 0; padding: 9px 15px;
    border-radius: 999px; cursor: pointer; white-space: nowrap; }
  #bar button:hover { background: var(--faint); }
  #bar button.active { background: var(--acc); color: #fff; }
  #bar .sep { width: 1px; height: 22px; background: var(--cardline); margin: 0 4px; }
  #bar .scen { display: none; }
  #bar.v3 .scen { display: inline-block; }

  body.export #bar, body.export #tip { display: none; }
  body.embed #bar [data-view], body.embed #red4, body.embed #theme, body.embed #bar .sep { display: none !important; }
  body.embed #bar:not(.v3) { display: none; }
  body.export *, body.export *::before { animation: none !important; transition: none !important; }
  body.export .particle { display: none; }
</style>
</head>

<svg id="stage" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Grafo de memorias de DesviAI"></svg>

  <button class="scen" id="play">▶ Reproducir</button>
  <span class="sep scen"></span>
  <button id="theme">☀ Claro</button>
</nav>

os buscando interferencias entre disciplinas…","fuente":"procedural/mitigacion-error-diseno.md","obra_id":null},{"name":"mitigacion-flujo-decisiones-cliente","memoria":"procedural","titulo":"Gestionar el flujo de decisiones del cliente","tags":["mitigacion","contexto","gestion","cliente","decisiones","morosidad","procedimiento"],"links":["contexto-equipo-decisiones","contexto-estructura-contractual"],"extracto":"Atiende el tipo de riesgo contextual contexto-equipo-decisiones (amplificador). Atenuar el efecto amplificador de un cliente con decisiones lentas o pagos morosos. 1. Designar un único interlocutor con poder de decisión del lado del cliente, o acordar un protocolo de aprobación con plazos máximos.…","fuente":"procedural/mitigacion-flujo-decisiones-cliente.md","obra_id":null},{"name":"mitigacion-madurez-ejecutivo","memoria":"procedural","titulo":"Controlar la madurez del proyecto ejecutivo","tags":["mitigacion","contexto","gestion","madurez","ejecutivo","procedimiento"],"links":["checklist-arranque-obra","contexto-madurez-ejecutivo","mitigacion-error-diseno"],"extracto":"Atiende el tipo de riesgo contextual contexto-madurez-ejecutivo. Reducir los RFIs y el retrabajo que provoca licitar con un proyecto ejecutivo incompleto. 1. Exigir un umbral mínimo de completitud antes de licitar (idealmente ≥90% de planos emitidos para construcción). Licitar sobre preliminares…","fuente":"procedural/mitigacion-madurez-ejecutivo.md","obra_id":null},{"name":"mitigacion-permisos","memoria":"procedural","titulo":"Mitigar riesgo de permisos","tags":["mitigacion","contexto","gestion","permisos","licencia","factibilidades","procedimiento"],"links":["checklist-arranque-obra","contexto-riesgo-regulatorio"],"extracto":"Atiende el tipo de riesgo contextual contexto-riesgo-regulatorio. Evitar que un permiso o factibilidad pendiente se convierta en un bloqueo de obra con retraso de plazo. 1. No movilizar sin licencia firme. Si la licencia está en trámite, no iniciar partidas que dependa comendado:\n  1. Revisión de constructibilidad antes de iniciar: un tercero revisa planos buscando interferencias entre disciplinas (estructura, instalaciones, arquitectura).\n  2. Coordinación BIM / detección de conflictos cuando el proyecto lo permita, para cazar interferencias en el modelo y no en obra.\n  3. Nivel de definición mínimo por partida antes de contratar: no arrancar una partida con planos incompletos (especialmente cimentación e instalaciones).\n  4. RFI ágil: canal formal de consultas técnicas con tiempo de respuesta acotado, para que una duda de diseño no paralice el frente de trabajo.\nFuente: memoria procedural [[mitigacion-error-diseno]]."}},"estadistica":{"titulo":"Proyecto nuevo · sin historial","proyecto":{"sup_m2":38807,"niveles":30,"sistema_constructivo":"Concreto Tradicional","nivel_acabado":"Alto"},"vecinos":[{"num":97,"costo":5.97,"alto":true,"episodio":false},{"num":118,"costo":12.25,"alto":true,"episodio":true},{"num":101,"costo":4.51,"alto":false,"episodio":false},{"num":110,"costo":2.24,"alto":false,"episodio":false},{"num":175,"costo":4.4,"alto":false,"episodio":true}],"diagnostico":{"pregunta":"¿Qué explica el riesgo de este proyecto?","traza":[{"paso":1,"tool":"consultar_shap","input":{"target":"desvio_costo"},"resumen":"desvio_costo: predicción 7.57% (media 4.88%); factor top 'nivel de avance del proyecto' +2.00 pts"},{"paso":2,"tool":"buscar_episodio","input":{},"resumen":"sin evidencia directa (El proyecto en contexto es nuevo (sin id histórico); no hay órdenes de cambio.)"},{"paso":3,"tool":"buscar_casos_similares","input":{"k":5},"resumen":"5 vecinos · tasa desvío alto costo 0.4 · 2 con episodio"}],"respuesta":"Estructuralmente, el modelo predice un desvío de costo de 7.57% (media histórica 4.88%). Los factores que MÁS lo empujan al alza son: nivel de avance del proyecto (+2.00 pts), m² por unidad (+0.26 pts), presupuesto inicial (+0.14 pts). Esta es la causa ex-ante (SHAP, capa 2).\n\nNO hay órdenes de cambio documentadas para este proyecto, así que la atribución de causa es una inferencia ESTADÍSTICA, no evidencia directa: de 5 obras comparables, 2 tuvieron desvío de costo alto real (tasa 40%). Entre las comparables con episodio documentado (118, 175), las causas típicas son diseño y alcance. Fuente: casos similares (capa 4) + patrones agregados (capa 3)."},"mitigacion":{"pregunta":"¿Cómo mitigo el riesgo?","traza":[{"paso":1,"tool":"consultar_shap","input":{"target":"desvio_costo"},"resumen":"desvio_costo: predicción 7.57% (media 4.88%); factor top 'nivel de avance del proyecto' +2.00 pts"},{"paso":2,"tool":"buscar_episodio","input":{},"resumen":"sin evidencia directa (El proyecto en contexto es nuevo (sin id histórico); no hay órdenes de cambio.)"},{"paso":3,"tool":"leer_memoria","input":{"tipo":"procedural","tags":["diseño"]},"resumen":"1 docs: mitigacion-error-diseno"}],"respuesta":"Para mitigar el riesgo, el foco debe estar en las causas de mayor peso en el histórico (diseño y alcance). Procedimiento recomendado:\n  1. Revisión de constructibilidad antes de iniciar: un tercero revisa planos buscando interferencias entre disciplinas (estructura, instalaciones, arquitectura).\n  2. Coordinación BIM / detección de conflictos cuando el proyecto lo permita, para cazar interferencias en el modelo y no en obra.\n  3. Nivel de definición mínimo por partida antes de contratar: no arrancar una partida con planos incompletos (especialmente cimentación e instalaciones).\n  4. RFI ágil: canal formal de consultas técnicas con tiempo de respuesta acotado, para que una duda de diseño no paralice el frente de trabajo.\nFuente: memoria procedural [[mitigacion-error-diseno]]."}}},"resumen":{"n_obras":40,"n_causas":6,"n_procedimientos":8,"n_ordenes":82,"n_wikilinks":148,"n_docs":{"total":60,"semantica":12,"procedural":8,"episodica":40}}}</script>

  // =====================================================================
  // VISTA 2 — La red completa (embudo radial)
  // =====================================================================
  function vRed(world, over, d) {
    const R = DATA.resumen;
    // en esta vista solo entran las guías ligadas a una causa (+ checklist); las de contexto de gestión se ven en la vista 4
    const porCausa = DATA.procedural.filter(p => p.causa).length, nProcRed = porCausa + 1, nGestion = DATA.procedural.length - nProcRed;
    header(over, 'VISTA 2 · LA ESCALA', 'La memoria como red',
      `${R.n_obras} experiencias se condensan en ${R.n_causas} conceptos y ${nProcRed} procedimientos. Cada obra se conecta con las causas que presentó; cada causa, con su forma de mitigarla.`, 48);
    const cx = 1262, cy = 572, RO = 392, RC = 258, RP = 152, TOP = .66, GAP = .1, MIN = .55;
    const order = ['diseño', 'alcance', 'proveedor', 'sitio', 'normativa', 'clima'];
    const groups = order.map(k => ({ k, obras: DATA.obras.filter(o => o.dominante === k).sort((a, b) => b.costo - a.costo) }));
    // Cada sector ocupa al menos MIN radianes (las causas poco frecuentes no se amontonan);
    // el resto del círculo se reparte entre las obras de los sectores grandes.
    const avail = 2 * Math.PI - TOP - GAP * (groups.length - 1);
    let step = avail / DATA.obras.length;
    for (let it = 0; it < 20; it++) {
      const small = groups.filter(g => g.obras.length * step < MIN);
      const nBig = groups.filter(g => !small.includes(g)).reduce((s, g) => s + g.obras.length, 0);
      step = (avail - MIN * small.length) / Math.max(1, nBig);
    }
    let a = -Math.PI / 2 + TOP / 2;
    const ang = {};
    groups.forEach(g => {
      const span = Math.max(MIN, g.obras.length * step);
      const inner = g.obras.length ? span / g.obras.length : 0;
      g.obras.forEach((o, i) => ang[o.id] = a + inner * (i + .5));
      g.a0 = a; g.a1 = a + span; g.mid = a + span / 2;
      a += span + GAP;
    });
    groups.forEach(g => ang['causa-' + g.k] = g.mid);
    const P = (t, r) => [cx + r * Math.cos(t), cy + r * Math.sin(t)];
    const arcD = (a0, a1, r, rev) => { const [x0, y0] = P(rev ? a1 : a0, r), [x1, y1] = P(rev ? a0 : a1, r);
      return `M${x0},${y0} A${r},${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} ${rev ? 0 : 1} ${x1},${y1}`; };
    el('circle', { cx, cy, r: RO + 118, fill: 'url(#nebula)' }, world);

    // anillos guía + etiquetas curvas en la cuña superior
    [[RO, 'epi', 'MEMORIA EPISÓDICA'], [RC, 'sem', 'SEMÁNTICA'], [RP, 'proc', 'PROCEDURAL']].forEach(([rr, c, txt], i) => {
      el('circle', { cx, cy, r: rr, fill: 'none', stroke: `var(--${c})`, 'stroke-opacity': .28, 'stroke-dasharray': '2 7' }, world);
      const id = 'ring' + i;
      el('path', { id, d: arcD(-Math.PI / 2 - TOP / 2, -Math.PI / 2 + TOP / 2, rr + 5, false), fill: 'none' }, world);
      const t = el('text', { 'font-size': i ? 11.5 : 13, 'font-weight': 800, 'letter-spacing': '0.16em', fill: `var(--${c})` }, world);
      const tp = el('textPath', { startOffset: '50%', 'text-anchor': 'middle', text: txt }, t);
      tp.setAttribute('href', '#' + id); tp.setAttributeNS(XL, 'xlink:href', '#' + id);
    });

    // sectores (causa dominante) con etiqueta curva
    groups.forEach((g, i) => {
      if (!g.obras.length) return;
      el('path', { d: arcD(g.a0, g.a1, RO + 34, false), fill: 'none', stroke: 'var(--sem)', 'stroke-opacity': .45, 'stroke-width': 3, 'stroke-linecap': 'round' }, world);
      // en la mitad inferior el arco se invierte para que el texto quede derecho (y crece hacia dentro)
      const rev = Math.sin(g.mid) > .15, id = 'sec' + i;
      el('path', { id, d: arcD(g.a0 - .2, g.a1 + .2, RO + (rev ? 86 : 70), rev), fill: 'none' }, world);
      const t = el('text', { 'font-size': 12.5, 'font-weight': 800, 'letter-spacing': '0.12em', fill: 'var(--muted)' }, world);
      const tp = el('textPath', { startOffset: '50%', 'text-anchor': 'middle', text: `${SHORT[g.k].toUpperCase()} · ${g.obras.length}` }, t);
      tp.setAttribute('href', '#' + id); tp.setAttributeNS(XL, 'xlink:href', '#' + id);
    });

    const gE = el('g', {}, world), gP = el('g', {}, world), gN = el('g', {}, world);
    const links = [], r = rng(9);
    const nodeR = o => 4 + o.costo * .75;
    const cR = c => 20 + c.pct_costo * .95;

    // obra → causa (curvas hacia el anillo semántico)
    [...E.obra_causa].sort((p, q) => p.dominante - q.dominante).forEach(e => {
      const t1 = ang[e.from], t2 = ang[e.to];
      const mid = Math.atan2(Math.sin(t1) + Math.sin(t2), Math.cos(t1) + Math.cos(t2));
      const [x1, y1] = P(t1, RO - nodeR(byId[e.from]) - 2), [x2, y2] = P(t2, RC + cR(byId[e.to]) * .6), [qx, qy] = P(mid, RC + (RO - RC) * .38);
      const id = 'p' + (pid++);
      edge(gE, d, `M${x1},${y1} Q${qx},${qy} ${x2},${y2}`, [x1, y1, x2, y2], { id, a: e.from, b: e.to, c1: 'epi', c2: 'sem',
        w: .9 + e.pct * .05, op: e.dominante ? .62 : .2 });
      links.push({ a: e.from, b: e.to });
      if (e.dominante) particle(gP, id, 'epi', e.from, e.to, 3.2, -(r() * 3.2).toFixed(2), 2.4);
    });
    // causa → procedimiento (o hueco)
    DATA.causas.forEach(c => {
      const t = ang[c.id], [x1, y1] = P(t, RC - cR(c)), [x2, y2] = P(t, RP + 24), pr = procByCausa[c.key];
      if (pr) {
        const id = 'p' + (pid++);
        edge(gE, d, `M${x1},${y1} L${x2},${y2}`, [x1, y1, x2, y2], { id, a: c.id, b: pr.id, c1: 'sem', c2: 'proc', w: 3.4, op: .95, cls: 'flow' });
        links.push({ a: c.id, b: pr.id });

      } else {
        el('path', { d: `M${x1},${y1} L${x2},${y2}`, stroke: 'var(--warn)', 'stroke-width': 2, 'stroke-dasharray': '3 6', opacity: .6, fill: 'none', class: 'edge', 'data-a': c.id, 'data-b': 'hueco-' + c.key }, gE);
        links.push({ a: c.id, b: 'hueco-' + c.key });
      }
    });
    // checklist → procedimientos
    E.checklist.forEach(e => {
      const t = ang['causa-' + byId[e.to].causa], [x1, y1] = P(t, 40), [x2, y2] = P(t, RP - 24);
      edge(gE, d, `M${x1},${y1} L${x2},${y2}`, [x1, y1, x2, y2], { a: e.from, b: e.to, c1: 'proc', c2: 'proc', w: 1.6, op: .6 });
      links.push({ a: e.from, b: e.to });
    });

    // nodos: obras
    DATA.obras.forEach(o => {
      const t = ang[o.id], [x, y] = P(t, RO), rr = nodeR(o), g = el('g', { 'data-id': o.id }, gN);
      g.dataset.tip = tipHTML('Memoria episódica', `Obra ${o.num}`,
        `${esc(o.tipologia)} · acabado ${esc(o.acabado)}<br>Desvío real: <b>+${o.costo}%</b> costo · <b>+${o.plazo}%</b> plazo<br>${o.n_oc} órdenes de cambio · dominante: <b>${esc(SHORT[o.dominante])}</b>`,
        `knowledge/episodica/obra-${String(o.num).padStart(3, '0')}.md`);
      if (o.riesgo === 'ALTO') el('circle', { cx: x, cy: y, r: rr + 4.5, fill: 'none', stroke: 'var(--risk)', 'stroke-width': 1.8, opacity: .9 }, g);
      el('circle', { cx: x, cy: y, r: rr, fill: 'var(--epi)', stroke: 'var(--bg1)', 'stroke-width': 1.5, class: 'glow' }, g);
      const deg = t * 180 / Math.PI, left = Math.cos(t) < 0, [lx, ly] = P(t, RO + rr + (o.riesgo === 'ALTO' ? 12 : 8));
      T(g, lx, ly + 4, `#${o.num}`, { size: 12, weight: 700, mono: true, fill: 'var(--ink2)', anchor: left ? 'end' : 'start',
        transform: `rotate(${left ? deg + 180 : deg},${lx},${ly})` });
    });
    // nodos: causas
    DATA.causas.forEach(c => {
      const t = ang[c.id], [x, y] = P(t, RC), rr = cR(c), g = el('g', { 'data-id': c.id }, gN);
      g.dataset.tip = tipHTML('Memoria semántica · concepto', c.nombre,
        `${esc(c.definicion)}<br><br><b>${c.pct_costo}%</b> del sobrecosto · <b>${c.pct_plazo}%</b> del sobreplazo<br>Presente en ${c.n_obras} obras · dominante en ${c.n_dominante}`, c.fuente);
      el('circle', { cx: x, cy: y, r: rr + 9, fill: 'var(--sem)', 'fill-opacity': .1, class: 'pulse' }, g);
      el('circle', { cx: x, cy: y, r: rr, fill: 'var(--solid)', stroke: 'var(--sem)', 'stroke-width': 2.6, class: 'glow' }, g);
      T(g, x, y + 6, pct(c.pct_costo), { size: rr > 34 ? 17 : 14, weight: 800, anchor: 'middle', mono: true, fill: 'var(--sem)' });
      const up = Math.sin(t) < -.2, [lx, ly] = P(t, RC + rr + 12), base = up ? ly - 26 : ly + 16;
      T(g, lx, base, SHORT[c.key], { size: 15, weight: 800, anchor: 'middle', cls: 'halo' });
      T(g, lx, base + 18, `presente en ${c.n_obras} obras`, { size: 12, weight: 700, anchor: 'middle', fill: 'var(--muted)', cls: 'halo' });
    });
    // nodos: procedimientos + huecos + checklist
    DATA.causas.forEach(c => {

      if (pr) {

        el('circle', { cx: x, cy: y, r: 22, fill: 'var(--solid)', stroke: 'var(--proc)', 'stroke-width': 2.6, class: 'glow' }, g);
        el('path', { d: `M${x - 8},${y} l5,6 l11,-12`, fill: 'none', stroke: 'var(--proc)', 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
        const [lx, ly] = P(t, RP - 44);

     [nProcRed, 'proc', 'procedimientos', `${porCausa} guías por causa + checklist` + (nGestion > 0 ? ` · +${nGestion} de gestión en la vista 4` : ''), 664]].forEach(([n, c, t, s, y], i) => {

      if (i < 2) {

        el('path', { d: `M${sx + 19},${y + 78} L${sx + 26},${y + 88} L${sx + 33},${y + 78}`, fill: 'none', stroke: `var(--${c})`, 'stroke-width': 2.5, opacity: .7 }, L);

      { size: 12.5, weight: 500, anchor: 'end', fill: 'var(--muted)' });

  // =====================================================================

    const m = (shapTr?.resumen || '').match(/predicción ([\d.]+)%.*factor top '([^']+)' ([+-][\d.]+) pts/);
    const sh = el('g', { 'data-id': 'shap' }, gN); add(1, sh);
    sh.dataset.tip = tipHTML('Modelo · capa 2', 'consultar_shap', esc(shapTr?.resumen || ''));
    card(sh, 80, 372, 440, 118, 'acc', { rx: 22 });
    T(sh, 104, 402, 'MODELO · CAPA 2', { size: 11, weight: 800, ls: '0.16em', fill: 'var(--acc)' });
    T(sh, 104, 430, 'SHAP · causa estructural', { size: 18, weight: 800 });
    T(sh, 104, 458, m ? wrap(`Predicción ${m[1]}% · factor top: ${m[2]} (${m[3]} pts)`, 50) : '—', { size: 14, weight: 500, fill: 'var(--ink2)', lh: 19 });

    const stem = (y1, y2, n, tool, i) => {
      const e = el('path', { d: `M300,${y1} L300,${y2}`, stroke: 'var(--acc)', 'stroke-width': 3, fill: 'none', class: 'flow' }, gE);
      const b = el('g', {}, gE);
      el('circle', { cx: 300, cy: (y1 + y2) / 2, r: 14, fill: 'var(--acc)', class: 'sglow' }, b);
      T(b, 300, (y1 + y2) / 2 + 5, String(n), { size: 14, weight: 800, anchor: 'middle', fill: '#fff' });
      T(b, 326, (y1 + y2) / 2 + 5, tool, { size: 14, weight: 700, mono: true, fill: 'var(--acc)' });
      add(i, e, b);
    };
    stem(316, 372, 1, 'consultar_shap', 1);
    stem(490, 542, 2, 'buscar_episodio', 2);

    const dg = el('g', { 'data-id': 'decision' }, gN); add(2, dg);
    dg.dataset.tip = tipHTML('Decisión autónoma (binaria y auditable)', '¿Existe episodio de esta obra?',
      'Si <b>sí</b>: cita las órdenes de cambio como evidencia directa.<br>Si <b>no</b>: recurre a casos similares y lo declara como inferencia estadística.');
    const DX = 300, DY = 630, DR = 88;
    el('polygon', { points: `${DX},${DY - DR} ${DX + DR},${DY} ${DX},${DY + DR} ${DX - DR},${DY}`, fill: 'var(--solid)', stroke: 'var(--acc)', 'stroke-width': 2.6, class: 'glow' }, dg);
    T(dg, DX, DY - 6, '¿Hay episodio', { size: 15, weight: 800, anchor: 'middle' });
    T(dg, DX, DY + 14, 'de esta obra?', { size: 15, weight: 800, anchor: 'middle' });
    T(dg, DX - DR - 16, DY - 3, 'DECISIÓN', { size: 11, weight: 800, ls: '0.16em', anchor: 'end', fill: 'var(--acc)' });
    T(dg, DX - DR - 16, DY + 13, 'AUTÓNOMA', { size: 11, weight: 800, ls: '0.16em', anchor: 'end', fill: 'var(--acc)' });

    // --- ramas
    const branch = (key, active) => {
      const y = rowY[key], cls = active ? '' : 'inactive', nodes = [];
      // bifurcación
      // ambas ramas salen del vértice derecho del rombo
      const p = bez(DX + DR, DY, 652, y, .55);
      const fe = edge(gE, d, bezD(p), [p[0], p[1], p[6], p[7]], { a: 'decision', b: key, c1: 'acc', c2: 'epi', w: active ? 4 : 2.5, op: 1, cls: 'flow ' + cls });
      const [lx, ly] = bezAt(p, key === 'si' ? .3 : .42);
      const lbl = edgeLabel(gE, lx, ly + (key === 'si' ? 0 : 24), key === 'si' ? 'SÍ → evidencia directa' : 'NO → evidencia estadística', 'acc', 'decision', key, false);
      if (!active) lbl.g.classList.add('inactive');
      // columna episódica
      const ge = el('g', { 'data-id': key + '-epi', class: cls }, gN);
      card(ge, 652, y - 72, 356, 144, 'epi');
      const gs = el('g', { 'data-id': key + '-sem', class: cls }, gN);
      card(gs, 1072, y - 72, 356, 144, 'sem');
      let causasRama, tipEpi;
      if (key === 'si') {
        T(ge, 678, y - 42, 'EPISODIO', { size: 11, weight: 800, ls: '0.16em', fill: 'var(--epi)' });
        T(ge, 678, y - 12, `Obra ${obra.num}`, { size: 24, weight: 800 });
        T(ge, 678, y + 14, `${obra.n_oc} órdenes de cambio · +${obra.costo}% costo`, { size: 14, weight: 500, fill: 'var(--ink2)' });
        T(ge, 678, y + 48, `buscar_episodio(${obra.num}) → existe_evidencia`, { size: 12.5, weight: 700, mono: true, fill: 'var(--epi)' });
        causasRama = E.obra_causa.filter(e => e.from === obra.id).sort((a, b) => b.pct - a.pct)
          .map(e => ({ text: `${WORD[e.to.replace('causa-', '')]} ${pct(e.pct)}${e.dominante ? ' ★' : ''}`, c: 'sem', filled: e.dominante }));
        tipEpi = tipHTML('Memoria episódica · evidencia directa', `Obra ${obra.num}`, esc(SC.directa.diagnostico.traza.find(t => t.tool === 'buscar_episodio')?.resumen || ''),
          `knowledge/episodica/obra-${String(obra.num).padStart(3, '0')}.md`);
        T(gs, 1098, y - 42, 'CAUSAS DOCUMENTADAS', { size: 11, weight: 800, ls: '0.16em', fill: 'var(--sem)' });
        T(gs, 1098, y - 14, 'Órdenes de cambio del episodio', { size: 15, weight: 800 });
      } else {
        const vec = SC.estadistica.vecinos, conEp = vec.filter(v => v.episodio), altos = vec.filter(v => v.alto).length;
        T(ge, 678, y - 42, 'CASOS SIMILARES · kNN', { size: 11, weight: 800, ls: '0.16em', fill: 'var(--epi)' });
        chips(ge, 678, y - 28, vec.map(v => ({ text: `#${v.num}`, c: 'epi', filled: v.episodio })), 320);
        T(ge, 678, y + 28, `${altos} de ${vec.length} con desvío alto · ${conEp.length} con episodio`, { size: 14, weight: 500, fill: 'var(--ink2)' });
        T(ge, 678, y + 52, 'buscar_casos_similares(k=5)', { size: 12.5, weight: 700, mono: true, fill: 'var(--epi)' });
        // Sin evidencia directa, el agente elige por los pesos agregados de la memoria semántica
        causasRama = [...DATA.causas].sort((a, b) => b.pct_costo - a.pct_costo).slice(0, 4)
          .map((c, i) => ({ text: `${WORD[c.key]} ${pct(c.pct_costo)}${i === 0 ? ' ★' : ''}`, c: 'sem', filled: i === 0 }));
        tipEpi = tipHTML('Memoria episódica · casos similares', 'Obras más parecidas',
          vec.map(v => `#${v.num} · +${v.costo}% costo${v.alto ? ' · desvío alto' : ''}${v.episodio ? ' · <b>con episodio</b>' : ''}`).join('<br>'), 'kNN sobre el histórico (capa 4)');
        T(gs, 1098, y - 42, 'CONOCIMIENTO GENERAL', { size: 11, weight: 800, ls: '0.16em', fill: 'var(--sem)' });
        T(gs, 1098, y - 14, 'Peso de cada causa en el histórico', { size: 15, weight: 800 });
      }
      ge.dataset.tip = tipEpi;
      chips(gs, 1098, y + 2, causasRama, 320);
      gs.dataset.tip = tipHTML('Memoria semántica', key === 'si' ? 'Causas documentadas en el episodio' : 'Pesos agregados del histórico',
        (key === 'si' ? '' : 'Sin evidencia directa, el agente se apoya en el peso de cada causa en todo el histórico y en la tasa de desvío de los casos similares.<br><br>') +
        causasRama.map(c => esc(c.text)).join('<br>'), 'semantica/causas-de-desvio.md');
      const e2 = el('path', { d: `M1008,${y} L1072,${y}`, stroke: grad(d, 1008, y, 1072, y, 'epi', 'sem'), 'stroke-width': active ? 4 : 2.5, fill: 'none', class: 'edge flow ' + cls }, gE);
      nodes.push({ fe, lbl: lbl.g, ge, gs, e2 });
      return nodes[0];
    };
    const A = branch('si', dir), B = branch('no', !dir);
    const actB = dir ? A : B;
    add(3, actB.fe, actB.lbl, actB.ge); add(4, actB.e2, actB.gs);

    // --- procedimiento (compartido si ambas ramas llevan al mismo)
    const docOf = sc => (sc.mitigacion.traza.find(t => t.tool === 'leer_memoria')?.resumen || '').match(/docs: ([\w-]+)/)?.[1];
    const pA = byId['proc-' + docOf(SC.directa)], pB = byId['proc-' + docOf(SC.estadistica)];
    const shared = pA && pB && pA.id === pB.id;
    const drawProc = (pr, y, cls) => {
      const g = el('g', { 'data-id': 'proc-' + y, class: cls }, gN);
      g.dataset.tip = tipHTML('Memoria procedural', pr.nombre, `<ul>${pr.pasos.map(s => `<li>${esc(s)}</li>`).join('')}</ul>`, pr.fuente);
      card(g, 1492, y - 84, 346, 170, 'proc');
      T(g, 1518, y - 54, 'PROCEDIMIENTO', { size: 11, weight: 800, ls: '0.16em', fill: 'var(--proc)' });
      const tl = wrap(procShort(pr), 26);
      T(g, 1518, y - 26, tl, { size: 17, weight: 800, lh: 20 });
      const sy = y - 26 + tl.length * 20 + 10;
      pr.pasos.slice(0, 2).forEach((s, i) => T(g, 1518, sy + i * 20, `›  ${s.length > 44 ? s.slice(0, 42) + '…' : s}`, { size: 13, weight: 500, fill: 'var(--ink2)' }));
      const tr = (dir ? SC.directa : SC.estadistica).mitigacion.traza.find(t => t.tool === 'leer_memoria');
      T(g, 1518, y + 72, `leer_memoria(procedural, [${(tr?.input?.tags || []).join(', ')}])`, { size: 11.5, weight: 700, mono: true, fill: 'var(--proc)' });
      return g;
    };
    const stepN = dir ? 3 : 4;
    const toProc = (key, py, active) => {
      const y = rowY[key], p = bez(1428, y, 1492, py, .5);
      const e = el('path', { d: bezD(p), stroke: grad(d, 1428, y, 1492, py, 'sem', 'proc'), 'stroke-width': active ? 4 : 2.5, fill: 'none', class: 'edge flow ' + (active ? '' : 'inactive') }, gE);
      return e;
    };
    let procEl, eA, eB;
    if (shared) {
      procEl = drawProc(pA, 500, ''); eA = toProc('si', 500, dir); eB = toProc('no', 500, !dir);
    } else {
      const g1 = drawProc(pA || pB, rowY.si, dir ? '' : 'inactive'), g2 = drawProc(pB || pA, rowY.no, dir ? 'inactive' : '');
      procEl = dir ? g1 : g2; eA = toProc('si', rowY.si, dir); eB = toProc('no', rowY.no, !dir);
    }
    const eAct = dir ? eA : eB;
    const bx = 1460, by = shared ? (dir ? 430 : 570) : rowY[dir ? 'si' : 'no'];
    const badge = el('g', {}, gE);
    el('circle', { cx: bx, cy: by, r: 14, fill: 'var(--acc)', class: 'sglow' }, badge);
    T(badge, bx, by + 5, String(stepN), { size: 14, weight: 800, anchor: 'middle', fill: '#fff' });
    if (!dir) {
      const b3 = el('g', {}, gE);
      el('circle', { cx: 622, cy: rowY.no - 1, r: 14, fill: 'var(--acc)', class: 'sglow' }, b3);
      T(b3, 622, rowY.no + 4, '3', { size: 14, weight: 800, anchor: 'middle', fill: '#fff' });
      add(3, b3);
    }
    add(5, eAct, badge, procEl);

    // --- panel de trazas reales
    const px = 80, py = 800, pw = 1760, ph = 212, lg = el('g', {}, over);
    el('rect', { x: px, y: py, width: pw, height: ph, rx: 20, class: 'card', fill: 'var(--card)', stroke: 'var(--cardline)' }, lg);
    T(lg, px + 28, py + 34, 'TRAZA REAL DEL AGENTE', { size: 12, weight: 800, ls: '0.16em', fill: 'var(--acc)' });
    T(lg, px + pw - 28, py + 34, 'modo mock · reproducible sin API key · se regenera con build_data.py', { size: 12.5, weight: 600, anchor: 'end', fill: 'var(--muted)' });
    [act.diagnostico, act.mitigacion].forEach((turno, ci) => {
      const x0 = px + 28 + ci * 880, g = el('g', {}, lg);
      T(g, x0, py + 70, `PREGUNTA ${ci + 1}`, { size: 11, weight: 800, ls: '0.14em', fill: 'var(--muted)' });
      T(g, x0 + 104, py + 70, `“${turno.pregunta}”`, { size: 15, weight: 800 });
      turno.traza.forEach((t, i) => {
        const res = t.resumen.length > 78 ? t.resumen.slice(0, 76) + '…' : t.resumen;
        T(g, x0, py + 104 + i * 30, `${i + 1}.  ${t.tool}`, { size: 14, weight: 700, mono: true, fill: t.tool === 'buscar_episodio' ? 'var(--epi)' : t.tool === 'leer_memoria' ? 'var(--proc)' : t.tool === 'buscar_casos_similares' ? 'var(--epi)' : 'var(--acc)' });
        T(g, x0 + 250, py + 104 + i * 30, `→ ${res}`, { size: 13, weight: 500, mono: true, fill: 'var(--ink2)' });
      });
      add(6, g);
    });

    interact(world, [], false);
    // reproducción
    world._steps = steps;
  }

  function play() {
    const world = document.getElementById('world'), over = document.getElementById('overlay');
    if (!world || !world._steps) return;
    const all = world._steps.flat();
    [world, over].forEach(g => g.classList.add('playing'));
    all.forEach(e => e.classList.add('pending'));
    world._steps.forEach((els, i) => setTimeout(() => els.forEach(e => e.classList.remove('pending')), 350 + i * 750));
    setTimeout(() => [world, over].forEach(g => g.classList.remove('playing')), 350 + world._steps.length * 750 + 200);
  }

  // =====================================================================
  function render() {
    svg.innerHTML = ''; gid = 0; pid = 0;
    document.documentElement.dataset.theme = S.theme;
    const d = el('defs', {}, svg);
    backdrop(d, S.view === 'narrativa' ? [960, 580, 760] : S.view === 'agente' ? [1100, 470, 700] : null);
    const world = el('g', { id: 'world' }, svg), over = el('g', { id: 'overlay' }, svg);
    ({ narrativa: vNarrativa, red: vRed, agente: vAgente })[S.view](world, over, d);
    setupZoom(world);
    bar.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('active', b.dataset.view === S.view));
    bar.querySelectorAll('[data-scen]').forEach(b => b.classList.toggle('active', b.dataset.scen === S.scen));
    bar.classList.toggle('v3', S.view === 'agente');
    document.getElementById('theme').textContent = S.theme === 'dark' ? '☀ Claro' : '☾ Oscuro';
    if (!S.exp) {
      const p = new URLSearchParams({ view: S.view, theme: S.theme }); if (S.view === 'agente') p.set('scenario', S.scen);
      if (S.embed) p.set('embed', '1');
      history.replaceState(null, '', '?' + p);
    }
  }

  bar.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.view) S.view = b.dataset.view;
    else if (b.dataset.scen) S.scen = b.dataset.scen;
    else if (b.id === 'theme') S.theme = S.theme === 'dark' ? 'light' : 'dark';
    else if (b.id === 'play') return play();
    else if (b.id === 'red4') return openRed();
    render();
  });
  const openRed = () => { location.href = 'red-interactiva.html?theme=' + S.theme; };
  const VIEWS = ['narrativa', 'red', 'agente'];
  window.addEventListener('keydown', ev => {
    if (S.embed && !['s', 'S', 'p', 'P', ' '].includes(ev.key)) return;   // en la app solo escenario y reproducir
    if (ev.key === '4') return openRed();
    if (ev.key === '1' || ev.key === '2' || ev.key === '3') S.view = VIEWS[+ev.key - 1];
    else if (ev.key === 'ArrowRight' || ev.key === 'PageDown') S.view = VIEWS[(VIEWS.indexOf(S.view) + 1) % 3];
    else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') S.view = VIEWS[(VIEWS.indexOf(S.view) + 2) % 3];
    else if (ev.key.toLowerCase() === 't') S.theme = S.theme === 'dark' ? 'light' : 'dark';
    else if (ev.key.toLowerCase() === 's') S.scen = S.scen === 'directa' ? 'estadistica' : 'directa';
    else if (ev.key.toLowerCase() === 'p' || ev.key === ' ') { ev.preventDefault(); return play(); }
    else return;
    render();
  });
  let idle;
  const wake = () => { bar.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => bar.classList.add('idle'), 2600); };
  window.addEventListener('mousemove', wake); wake();
  render();
})();
</script>
</body>
</html>
